<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D STYLE - Фризьорски салон</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    body {
      background-color: #7d7d7d;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
      color: #000;
    }

    /* Заглавна част / Лого */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .salon-name {
      font-size: 14px;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .logo {
      font-size: 48px;
      color: #ff9ee2;
      text-shadow: 
        -3px -3px 0 #fff,  
         3px -3px 0 #fff,
        -3px  3px 0 #fff,
         3px  3px 0 #fff,
         0px  0px 10px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }

    /* Основно меню с бутони */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
      align-items: center;
    }

    /* Стил за бутоните - съвпадащ с менюто */
    .main-btn, .modal-btn {
      width: 100%;
      background-color: #f7c5e5;
      color: #000;
      border: 3px solid #fff;
      padding: 16px 10px;
      border-radius: 25px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.1s, background-color 0.2s;
      text-align: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .main-btn:active, .modal-btn:active {
      transform: scale(0.96);
      background-color: #f2a8d8;
    }

    /* Изскачащи прозорци (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: #7d7d7d;
      border: 4px solid #fff;
      border-radius: 25px;
      padding: 25px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      position: relative;
      animation: popIn 0.2s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .modal-title {
      font-size: 22px;
      color: #ff9ee2;
      text-shadow: 
        -2px -2px 0 #fff,  
         2px -2px 0 #fff,
        -2px  2px 0 #fff,
         2px  2px 0 #fff;
      letter-spacing: 1px;
    }

    .modal-text {
      font-size: 18px;
      color: #fff;
      line-height: 1.5;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    /* Поле за въвеждане на номер */
    .phone-input {
      width: 100%;
      background-color: #fff;
      color: #000;
      border: 3px solid #f7c5e5;
      padding: 14px;
      border-radius: 20px;
      font-size: 18px;
      text-align: center;
      outline: none;
      font-family: Arial, sans-serif;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .close-x {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #fff;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="salon-name">Фризьорски салон Доктор Иван Басанович</div>
    <div class="logo">⭐ D STYLE ⭐</div>
  </div>

  <div class="btn-container">
    <button class="main-btn" onclick="openModal('booking-modal')">Запазване на час</button>
    <button class="main-btn" onclick="openModal('location-modal')">Местоположение</button>
    <button class="main-btn" onclick="openModal('services-modal')">Услуги</button>
  </div>

  <!-- 1. ЗАПАЗВАНЕ НА ЧАС -->
  <div id="booking-modal" class="modal-overlay">
    <div class="modal-box">
      <span class="close-x" onclick="closeModal('booking-modal')">✖</span>
      <div id="form-container" style="width: 100%;">
        <div class="modal-title" style="margin-bottom: 15px;">Телефон за връзка</div>
        <form onsubmit="sendBooking(event)">
          <input type="tel" id="user-phone" class="phone-input" placeholder="08X XXX XXXX" required>
          <button type="submit" class="modal-btn">Изпращане</button>
        </form>
      </div>
      <div id="success-message" style="display: none; width: 100%;">
        <div class="modal-title" style="color: #98ff98; margin-bottom: 15px;">Очаквайте обаждане!</div>
        <button class="modal-btn" onclick="closeModal('booking-modal')">Затвори</button>
      </div>
    </div>
  </div>

  <!-- 2. МЕСТОПОЛОЖЕНИЕ -->
  <div id="location-modal" class="modal-overlay">
    <div class="modal-box">
      <span class="close-x" onclick="closeModal('location-modal')">✖</span>
      <div class="modal-title">Местоположение</div>
      <div class="modal-text">ЛевскиПриморски, ул. ,,Доктор Иван Басанович” 111, 9010 Варна</div>
      <button class="modal-btn" onclick="closeModal('location-modal')">Затвори</button>
    </div>
  </div>

  <!-- 3. УСЛУГИ -->
  <div id="services-modal" class="modal-overlay">
    <div class="modal-box">
      <span class="close-x" onclick="closeModal('services-modal')">✖</span>
      <div class="modal-title">Услуги</div>
      <div class="modal-text">
        Женско подстригване - 20 €<br><br>
        Мъжко подстригване - 15 €<br><br>
        Детско подстригване - 10 €
      </div>
      <button class="modal-btn" onclick="closeModal('services-modal')">Затвори</button>
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'booking-modal') {
        setTimeout(() => {
          document.getElementById('form-container').style.display = 'block';
          document.getElementById('success-message').style.display = 'none';
          document.getElementById('user-phone').value = '';
        }, 300);
      }
    }

    function sendBooking(event) {
      event.preventDefault();
      const phone = document.getElementById('user-phone').value;

      fetch("https://formsubmit.co/ajax/desidesi22224@gmail.com", {
        method: "POST",
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          "_subject": "Поиск за подстригване",
          "Номер": phone
        })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
      });
    }
  </script>

</body>
</html>
